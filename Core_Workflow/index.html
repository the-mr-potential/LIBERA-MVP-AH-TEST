<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Libera</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #000; display: flex; align-items: center; justify-content: center; font-family: Calibri, "Segoe UI", Arial, sans-serif; color: #fff; padding: 16px; }
  .phone { width: 340px; height: 640px; background: #1e1e1e; border: 12px solid #a9c8e8; border-radius: 40px; box-shadow: 0 0 0 3px #6d9ccf; padding: 24px 20px; display: flex; flex-direction: column; overflow-y: auto; }
  h1 { font-size: 22px; font-weight: 400; letter-spacing: 1px; text-align: center; margin: 0 0 16px; }
  button { font: inherit; color: #fff; cursor: pointer; border-radius: 6px; }
  .btn { background: #000; border: 2px solid #fff; padding: 8px 12px; width: 100%; }
  .blue { background: #2e6db0; border: 2px solid #a9c8e8; padding: 6px; width: 100%; font-size: 14px; }
  .green { background: #1d4d1d; border: 2px solid #8fd18f; padding: 6px 20px; }
  .light { background: #a9c8e8; color: #000; border: 2px solid #6d9ccf; padding: 6px 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: #2b2b2b; border: 1px solid #a9c8e8; padding: 4px 10px; font-size: 13px; }
  input { width: 100%; background: #000; color: #fff; border: 2px solid #fff; border-radius: 6px; padding: 8px 12px; font: inherit; text-align: center; }
  label { display: block; text-align: center; margin: 32px 0 10px; font-size: 16px; }
  .card { margin-top: 18px; font-size: 14px; }
  .card ul, .detail ul { margin: 4px 0 0; padding-left: 18px; }
  .card button { background: none; border: none; color: #a9c8e8; text-decoration: underline; padding: 0; font-size: 14px; border-radius: 0; }
  .q { text-align: center; font-size: 14px; margin: 0 0 6px; }
  .bottom { margin-top: auto; padding-top: 20px; }
  .detail { font-size: 14px; }
  .answer { font-size: 14px; white-space: pre-wrap; margin: 12px 0 0; overflow-wrap: anywhere; }
  .answer a { color: #a9c8e8; }
  .muted { font-size: 13px; text-align: center; color: #ccc; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel">
const { useState, useRef } = React;

// Demo data — swap for a real API later.
const RESOURCES = [
  { name: "Math Tutoring Center", category: "Tutoring", keywords: ["math", "calculus", "algebra", "tutor", "tutoring", "homework", "stats"],
    short: "Free drop-in tutoring for math courses.",
    description: "Peer and staff tutors help with algebra, calculus, statistics and more.",
    locations: ["Library, Room 210", "Science Hall, Room 105"],
    access: "Walk in during open hours (Mon–Thu 10am–6pm). Bring your student ID and course materials.",
    link: "https://example.edu/tutoring" },
  { name: "Writing Center", category: "Tutoring", keywords: ["writing", "essay", "paper", "english", "tutor", "tutoring"],
    short: "One-on-one help with essays and papers.",
    description: "Consultants help with brainstorming, drafting, citations and revision.",
    locations: ["Humanities Bldg, Room 120"],
    access: "Book a 30-minute appointment online or walk in if a consultant is free.",
    link: "https://example.edu/writing" },
  { name: "IT Help Desk", category: "IT Help", keywords: ["wifi", "password", "login", "computer", "laptop", "email", "it", "canvas", "printer", "printing"],
    short: "Help with Wi-Fi, passwords, email and devices.",
    description: "Technicians troubleshoot account access, campus Wi-Fi, software and hardware.",
    locations: ["Tech Center, Room 001", "Library, 1st floor kiosk"],
    access: "Submit a ticket online, call ext. 4357, or visit in person with your student ID.",
    link: "https://example.edu/it" },
  { name: "Counseling Services", category: "Counseling", keywords: ["stress", "anxiety", "counseling", "counselor", "therapy", "depressed", "sad", "mental", "health", "overwhelmed"],
    short: "Free, confidential counseling for students.",
    description: "Licensed counselors offer individual sessions, groups and crisis support.",
    locations: ["Student Wellness Center, 2nd floor"],
    access: "Call or schedule online for an intake appointment. Same-day crisis visits available.",
    link: "https://example.edu/counseling" },
  { name: "Financial Aid Office", category: "Financial Aid", keywords: ["money", "financial", "aid", "fafsa", "scholarship", "loan", "tuition", "grant"],
    short: "Questions about FAFSA, loans and scholarships.",
    description: "Advisors help with aid packages, FAFSA, scholarships and payment plans.",
    locations: ["Administration Bldg, Room 140"],
    access: "Log in to the student portal to message an advisor, or visit during walk-in hours.",
    link: "https://example.edu/finaid" },
  { name: "Career Center", category: "Career", keywords: ["job", "internship", "resume", "career", "interview", "work"],
    short: "Resume reviews, internships and job search help.",
    description: "Career coaches help with resumes, mock interviews and finding internships.",
    locations: ["Student Union, Room 300"],
    access: "Book an appointment through the career portal. Resume drop-ins Fridays 1–4pm.",
    link: "https://example.edu/careers" },
];
const CATEGORIES = [...new Set(RESOURCES.map(r => r.category))];

// shortcut: whole-word keyword match only, swap for real search when there's a backend
const search = q => {
  const words = q.toLowerCase().match(/[a-z]+/g) || [];
  return RESOURCES.filter(r => words.some(w => r.keywords.includes(w)));
};

// Render plain text with URLs as safe links (no HTML injection).
function Linkified({ text }) {
  const parts = [];
  let pos = 0;
  for (const m of text.matchAll(/https?:\/\/[^\s<>"\]]+/g)) {
    const url = m[0].replace(/[.,;!?)]+$/, "");
    if (m.index > pos) parts.push(text.slice(pos, m.index));
    parts.push(<a key={m.index} href={url} target="_blank" rel="noopener noreferrer">{url}</a>);
    pos = m.index + url.length;
  }
  parts.push(text.slice(pos));
  return <>{parts}</>;
}

function App() {
  const [screen, setScreen] = useState("home");
  const [showCats, setShowCats] = useState(true);
  const [prompt, setPrompt] = useState("");
  const [query, setQuery] = useState("");
  const [results, setResults] = useState([]);
  const [selected, setSelected] = useState(null);
  const [answer, setAnswer] = useState(null); // null = none, "" = loading
  const [answerError, setAnswerError] = useState(false);
  const latest = useRef(0);

  const ask = async e => {
    e.preventDefault();
    const question = prompt.trim();
    if (!question) return;
    const id = ++latest.current;
    setQuery(question); setResults(search(question)); setScreen("results");
    setAnswer(""); setAnswerError(false);
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      if (!res.ok) throw new Error("Request failed");
      const data = await res.json();
      if (id === latest.current) setAnswer(data.answer);
    } catch (err) {
      if (id === latest.current) { setAnswer(null); setAnswerError(true); }
    }
  };
  const browse = cat => {
    latest.current++; setAnswer(null); setAnswerError(false);
    setQuery(`Category: ${cat}`); setResults(RESOURCES.filter(r => r.category === cat)); setScreen("results");
  };

  return (
    <div className="phone">
      <h1>LIBERA</h1>

      {screen === "home" && <>
        <button className="blue" onClick={() => setShowCats(!showCats)}>Browse by Category</button>
        {showCats && <div className="chips">
          {CATEGORIES.map(c => <button key={c} className="chip" onClick={() => browse(c)}>{c}</button>)}
        </div>}
        <form onSubmit={ask}>
          <label htmlFor="prompt">What do you need help with?</label>
          <input id="prompt" value={prompt} onChange={e => setPrompt(e.target.value)} placeholder="Prompt Box" />
          <div style={{ textAlign: "right", marginTop: 10 }}><button className="green" type="submit">Ask</button></div>
        </form>
      </>}

      {screen === "results" && <>
        <p className="q">“{query}”</p>
        {answer === "" && <p className="answer">LIBERA is finding an answer…</p>}
        {answer && <p className="answer"><Linkified text={answer} /></p>}
        {answerError && <p className="answer">LIBERA could not get an answer. Please try again.</p>}
        {results.length === 0 && <p className="card" style={{ textAlign: "center" }}>No results</p>}
        {results.map(r => (
          <div className="card" key={r.name}>
            <strong>{r.name}</strong>
            <ul>
              <li>{r.short}</li>
              <li><button onClick={() => { setSelected(r); setScreen("details"); }}>View details</button></li>
            </ul>
          </div>
        ))}
        <div className="bottom"><button className="btn" onClick={() => setScreen("home")}>Back to Home</button></div>
      </>}

      {screen === "details" && selected && <>
        <div className="detail">
          <strong>{selected.name}</strong>
          <ul>
            <li>{selected.description}</li>
            <li>Available locations: {selected.locations.join("; ")}</li>
            <li>Access instructions: {selected.access}</li>
          </ul>
        </div>
        <div style={{ textAlign: "center", marginTop: 16 }}>
          <a href={selected.link} target="_blank" rel="noopener"><button className="light">Official link</button></a>
          <p className="muted">(link to university resources)</p>
        </div>
        <div className="bottom"><button className="btn" onClick={() => setScreen("results")}>Back to Results</button></div>
      </>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
